name: Deploy Backend Spring Boot para AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v3

    - name: Autenticar no Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir e enviar imagem Docker do Backend
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USER }}/meu-site-aws-backend:latest

    - name: Atualizar servidor backend na AWS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          sudo docker pull ${{ secrets.DOCKER_USER }}/meu-site-aws-backend:latest
          sudo docker rm -f meu-backend-producao || true
          sudo docker run -d -p 8081:8081 \
            -e SPRING_DATASOURCE_URL="jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres" \
            -e SPRING_DATASOURCE_USERNAME="postgres.woenjrseqqipoyvqqjul" \
            -e SPRING_DATASOURCE_PASSWORD="Ma@0102464748" \
            --name meu-backend-producao ${{ secrets.DOCKER_USER }}/meu-site-aws-backend:latest