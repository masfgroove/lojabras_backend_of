services:
  - type: web
    name: lojabras-backend
    env: docker           # Alterado de 'maven' para 'docker' para usar o Dockerfile
    region: ohio 
    plan: free
    # Como você usa Dockerfile, o buildCommand e startCommand são lidos diretamente do Dockerfile.
    # Mas se quiser manter via yaml sem Dockerfile, seria diferente. Usando Dockerfile, remova buildCommand/startCommand daqui ou mude para docker.
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres.woenjrseqqipoyvqqjul
      - key: SPRING_DATASOURCE_PASSWORD
        value: Ma@0102464748
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "true"
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      # O Render injeta dinamicamente a porta na variável PORT. 
      # No Spring Boot, mapeamos o server.port para pegar ${PORT:-5678}